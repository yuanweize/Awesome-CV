identity:
  name: validate_application
  author: yuanweize
  label:
    en_US: Validate application manifest
    zh_Hans: 校验申请清单
description:
  human:
    en_US: Check requirements, claims, capability review, CV bullets, and cover-letter paragraphs against stored memory.
    zh_Hans: 根据职业记忆校验需求、事实、能力审查、CV bullet 和求职信段落映射。
  llm: >-
    Validate the structured application manifest after user confirmation and again after
    drafting. Reject missing deliverables or broken CV/cover-letter traceability before
    presenting an application bundle as final.
parameters:
- name: application_yaml
  type: string
  required: true
  label:
    en_US: Application manifest YAML
    zh_Hans: 申请清单 YAML
  human_description:
    en_US: The application.yaml content created for this JD.
    zh_Hans: 针对当前 JD 创建的 application.yaml 内容。
  llm_description: Complete application manifest YAML.
  form: llm
- name: job_description
  type: string
  required: true
  label:
    en_US: Saved job description
    zh_Hans: 已保存职位描述
  human_description:
    en_US: The exact JD text used to create the manifest.
    zh_Hans: 创建清单时使用的完整 JD 文本。
  llm_description: Exact vacancy text used by this application.
  form: llm
- name: strict
  type: boolean
  required: false
  default: true
  label:
    en_US: Strict final validation
    zh_Hans: 严格最终校验
  human_description:
    en_US: Require requirements, claims, confirmation, capability decisions, CV bullets, and cover-letter paragraphs.
    zh_Hans: 要求职位需求、选中事实、用户确认、能力决策、CV bullet 和求职信段落均完整。
  llm_description: Use true after the user approves the decision brief.
  form: llm
extra:
  python:
    source: tools/validate_application.py
