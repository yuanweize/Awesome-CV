name: CI

on:
  push:
    branches:
    - main
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install validation dependency
      run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

    - name: Run schema, privacy, unit, and syntax checks
      run: make check PYTHON=python

  # ---------------------------------------------------------------------------
  # LaTeX Build - Uses template data to verify the code works
  # ---------------------------------------------------------------------------
  latex:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Setup for CI (use template data)
      run: |
        cp templates/config.tex.example config.tex
        cp templates/letter_config.tex.example letter_config.tex
        mkdir -p sections
        cp templates/sections/*.tex sections/
        echo "Using template data for CI build"

    - name: Compile Resume
      uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
      with:
        root_file: src/main.tex
        latexmk_use_lualatex: true
      env:
        TEXINPUTS: "src/:.:"

    - name: Compile Cover Letter
      uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
      with:
        root_file: src/coverletter.tex
        latexmk_use_lualatex: true
      env:
        TEXINPUTS: "src/:.:"

    - name: Rename outputs for release
      run: |
        # latexmk may place output in CWD or next to source file
        ls -la *.pdf src/*.pdf 2>/dev/null || true
        mv main.pdf Awesome-CV_Example_Resume.pdf 2>/dev/null \
          || mv src/main.pdf Awesome-CV_Example_Resume.pdf
        mv coverletter.pdf Awesome-CV_Example_Cover_Letter.pdf 2>/dev/null \
          || mv src/coverletter.pdf Awesome-CV_Example_Cover_Letter.pdf

    - name: Upload Resume PDF
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: resume-pdf
        path: Awesome-CV_Example_Resume.pdf

    - name: Upload Cover Letter PDF
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: coverletter-pdf
        path: Awesome-CV_Example_Cover_Letter.pdf

  # ---------------------------------------------------------------------------
  # Release - the only job with write permission
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Resume PDF
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        name: resume-pdf

    - name: Download Cover Letter PDF
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        name: coverletter-pdf

    - name: Get build date
      id: date
      run: echo "date=$(date -u +'%d %b %Y')" >> "$GITHUB_OUTPUT"

    - name: Update latest release
      uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
      with:
        tag_name: latest
        name: "Build · ${{ steps.date.outputs.date }}"
        body: |
          Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${{ steps.date.outputs.date }} using **template data**.

          These example PDFs demonstrate the template layout — no real personal info included.
        files: |
          Awesome-CV_Example_Resume.pdf
          Awesome-CV_Example_Cover_Letter.pdf
        make_latest: true

  # ---------------------------------------------------------------------------
  # YAML Linting
  # ---------------------------------------------------------------------------
  yaml-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install yamllint
      run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

    - name: Lint YAML files
      run: yamllint .
