# ─────────────────────────────────────────────────────────────
# targets.yaml — Remote server configuration for tech-stack-collector
# Copy to targets.yaml and fill in your details.
# Supports password and SSH key authentication.
# ─────────────────────────────────────────────────────────────

targets:
- name: web-server-1
  host: 192.0.2.10                 # RFC 5737 documentation address
  port: 22
  user: root
  auth: key                        # "key" or "password"
  strict_host_key: true            # reject unknown host keys by default
  key_path: ~/.ssh/id_ed25519      # path to private key

- name: db-server-1
  host: 198.51.100.20              # RFC 5737 documentation address
  port: 22
  user: admin
  auth: password
  strict_host_key: true
  # Omit password so the runner prompts securely.

  # - name: another-server
  #   host: example.com
  #   port: 2222
  #   user: deploy
  #   auth: key
  #   strict_host_key: true
